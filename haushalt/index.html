<!doctype html>
<html lang="de" class="standalone-doc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<meta name="theme-color" content="#0A1426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--APP-START-->
<title>Haushaltsbuch René & Anika</title>
<style>
/* Haushaltsbuch – Layout: dunkle Glas-Optik wie eine iOS-App – große Begrüßung, Verlaufskarte mit der Empfehlung, Glas-Kacheln, schwebende Tab-Leiste. */
:root{
  --bg:#0A1426; --bg-2:#131C3A; --bg-3:#1D1840;
  --surface:rgba(255,255,255,.075); --surface-2:rgba(255,255,255,.05); --sheet:#111B31; --line:rgba(255,255,255,.12);
  --ink:#F3F6FB; --muted:rgba(226,233,245,.64); --faint:rgba(226,233,245,.42);
  --accent:#4DA3FF; --accent-ink:#FFFFFF; --accent-soft:rgba(77,163,255,.18);
  --hero-1:#1E9E78; --hero-2:#2F8FD8; --hero-3:#5E62E2;
  --good:#44D07E; --good-soft:rgba(68,208,126,.17); --warn:#F5A33B; --warn-soft:rgba(245,163,59,.17); --bad:#FF7A6E; --bad-soft:rgba(255,122,110,.17);
  --violet:#9A8FF7; --violet-soft:rgba(154,143,247,.2); --stamp:#8CB8FF; --stamp-soft:rgba(140,184,255,.15);
  --shadow:0 12px 32px rgba(0,0,0,.3);
  --f-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:22px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) linear-gradient(165deg,var(--bg) 0%,var(--bg-2) 55%,var(--bg-3) 100%) fixed;color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.glass,.card,.tile,.list,.steps,.todo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
/* Kopf */
.topbar{padding:14px 20px 4px;display:flex;gap:14px;align-items:flex-start}
.standalone-doc .topbar{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.hello{flex:1;min-width:0}
.hello h1{margin:0;font:800 34px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.hello .lead{margin:8px 0 0;font:700 19px/1.25 var(--f-display)}
.hello .sublead{margin:4px 0 0;color:var(--muted);font-size:15px}
.appicon{width:58px;height:58px;border-radius:16px;box-shadow:var(--shadow);flex:none}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 20px 4px}
.yearsw{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.yearsw button{border:0;background:none;width:38px;height:36px;font-size:20px;color:var(--muted)}
.yearsw button:disabled{opacity:.3}
.yearsw span{font-weight:700;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--good)} .chip.warn .dot{background:var(--warn)} .chip.err .dot{background:var(--bad)}
main{padding:10px 20px 24px;display:flex;flex-direction:column;gap:16px}
h2{font:700 20px var(--f-display);margin:8px 0 0;letter-spacing:-.01em}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.card{padding:18px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.banner{border-radius:var(--r);padding:14px 16px;background:var(--warn-soft);border:1px solid rgba(245,163,59,.35);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 220px;font-size:14.5px}
/* Verlaufskarte (Empfehlung) */
.hero{border-radius:28px;padding:22px 20px;color:#fff;background:linear-gradient(125deg,var(--hero-1) 0%,var(--hero-2) 50%,var(--hero-3) 100%);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hero .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero .lbl{font-size:17px;font-weight:500;color:rgba(255,255,255,.92)}
.hero h3{margin:6px 0 0;font:800 34px/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.hero .side{text-align:right;white-space:nowrap}
.hero .side b{display:block;font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hero .side span{font-size:15px;color:rgba(255,255,255,.88)}
.hero p{margin:0;font-size:15.5px;color:rgba(255,255,255,.92)}
.hero .note{font-size:14px;color:rgba(255,255,255,.78)}
.cmp{display:grid;gap:10px}
.cmp .row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#fff}
.hero .btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}
/* Symbole */
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.orange{background:var(--warn-soft);color:var(--warn)} .ico.blue{background:var(--accent-soft);color:var(--accent)} .ico.violet{background:var(--violet-soft);color:var(--violet)} .ico.green{background:var(--good-soft);color:var(--good)} .ico.red{background:var(--bad-soft);color:var(--bad)}
.ico.plain{width:26px;height:26px;border-radius:0;background:none}
.ico.plain svg{width:24px;height:24px}
/* Zu erledigen */
.todo{padding:18px 18px 8px}
.todo .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.todo .top b{font:700 22px var(--f-display)}
.todo .top span{font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.trow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:9px 0;text-align:left;font-size:17px}
.trow .n{font-variant-numeric:tabular-nums}
.trow.zero{color:var(--muted)}
/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.tile{text-align:left;color:inherit;width:100%}
.tile{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tile .th{display:flex;align-items:center;gap:10px;font:700 16px var(--f-display);min-width:0}
.tile .th .ico{width:36px;height:36px;border-radius:11px}
.tile .th>span:last-child{overflow-wrap:anywhere}
.tile dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 6px;font-size:14px}
.tile dt{color:var(--muted)} .tile dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.green i{background:var(--good)} .meter.violet i{background:var(--violet)} .meter.warn i{background:var(--warn)}
.wide{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left;color:var(--ink)}
.wide .main{flex:1;min-width:0}
.wide .t{font:700 18px var(--f-display);display:block}
.wide .sub{color:var(--muted);font-size:14px;display:block}
.wide .big{font:700 22px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.allclear{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px;text-align:center}
.allclear b{font:700 20px var(--f-display)}
/* Listen */
.list{display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;display:block}
.item .t,.item .sub{display:block}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13px;color:var(--muted)}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.item .a{font-weight:600;font-variant-numeric:tabular-nums}
.glyph{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 12px var(--f-body);letter-spacing:.03em;flex:none;background:var(--warn-soft);color:var(--warn)}
.glyph.v{background:var(--good-soft);color:var(--good)} .glyph.z{background:var(--accent-soft);color:var(--accent)} .glyph.k{background:var(--violet-soft);color:var(--violet)} .glyph.d{background:var(--surface-2);color:var(--muted)}
.stamps{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.stamp{font:700 10px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:4px 6px;white-space:nowrap}
.stamp.open{color:var(--bad);background:var(--bad-soft)} .stamp.paid{color:var(--muted);background:var(--surface-2)} .stamp.sub{color:var(--stamp);background:var(--stamp-soft)} .stamp.ref{color:var(--good);background:var(--good-soft)} .stamp.safe{color:var(--good);background:var(--good-soft)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.search::placeholder{color:var(--faint)}
.month{font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 140px}
/* Schwebende Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:34px;background:rgba(24,34,60,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:var(--shadow)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink);padding:8px 0 6px;border-radius:28px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--accent)}
/* Sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,8,18,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92%;border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h3{flex:1;margin:0;font:700 19px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{overflow-y:auto;padding:16px 18px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.x{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--muted);flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.field textarea{min-height:70px;resize:vertical}
select option{background:var(--sheet)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:14px;border-radius:14px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line)}
.hint.good{background:var(--good-soft);border-color:transparent}
.hint.warn{background:var(--warn-soft);border-color:transparent}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.check{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0;color:#fff}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.step input{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:rgba(255,255,255,.06);width:150px;max-width:100%;min-width:0}
.pages{display:flex;gap:8px;overflow-x:auto}
.pages img{height:110px;border-radius:10px;border:1px solid var(--line)}
.progress{height:5px;background:var(--surface);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.pdfview canvas{width:100%;height:auto;border-radius:8px;background:#fff;margin-bottom:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:15px;font-weight:500;z-index:80;max-width:90%;box-shadow:var(--shadow)}
.kv{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
details.card summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:22px;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:14px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.mut{background:var(--surface-2);color:var(--muted)}
code.sel{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:block;word-break:break-all;user-select:all}
.bignum{font:800 30px var(--f-display);font-variant-numeric:tabular-nums}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:370px){.tiles{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.hello h1{font-size:30px}.hero h3{font-size:32px}}
.ico.plain{background:none!important}

.glyph.orange{background:var(--warn-soft);color:var(--warn)} .glyph.blue{background:var(--accent-soft);color:var(--accent)} .glyph.violet{background:var(--violet-soft);color:var(--violet)} .glyph.green{background:var(--good-soft);color:var(--good)} .glyph.red{background:var(--bad-soft);color:var(--bad)}
.trow.cat{align-items:center;gap:12px}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.crow b{font-weight:600;white-space:nowrap}
.neg{color:var(--bad)!important} .pos{color:var(--good)!important}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 8px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500}
.cchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chips.months .cchip{min-width:52px}
.bigamount{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font:800 44px/1.1 var(--f-display);text-align:center;padding:10px 0;font-variant-numeric:tabular-nums}
.bigamount:focus{outline:none;border-bottom-color:var(--accent)}
.bigamount::placeholder{color:var(--faint)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;font-size:13px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.sum td{font-weight:700}
.tbl tr.negrow td{color:var(--bad)}
details.inact summary{padding:12px 16px;color:var(--muted);font-size:14px;cursor:pointer;border-top:1px solid var(--line)}
.addrow .t{color:var(--accent)}
.tab.add .fab{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin:-2px 0 1px}
.tab.add .fab svg{width:24px;height:24px}
.tab.add{padding-top:4px}
.item .ico{flex:none}
</style>
</head>
<body>
<div class="app" id="app">

<script>
'use strict';
const APP_VERSION='1.0.0';
const CLIENT_ID='224489061373-shav7m8rhadfbt94lurtvo4nji5mhe8f.apps.googleusercontent.com';
const API_KEY='';        // Google Picker (nur für Anika nötig)
const PROJECT_NUMBER=''; // Google-Cloud-Projektnummer
const SEED=null;/*__SEED__*/
const IN_PREVIEW=(()=>{ try{ return window.top!==window.self||/claude\.ai|claudeusercontent|anthropic/.test(location.hostname); }catch(e){ return true; } })();
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const z2=n=>String(n).padStart(2,'0');
const isoLocal=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const todayISO=()=>isoLocal(new Date());
const ym=d=>d.slice(0,7);
const addM=(M,n)=>{ const [y,m]=M.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+z2(d.getMonth()+1); };
const mDiff=(a,b)=>{ const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number); return (y2-y1)*12+(m2-m1); };
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MSHORT=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const mName=M=>MONTHS[+M.slice(5)-1]+' '+M.slice(0,4);
const fmtDate=iso=>{ if(!iso) return '–'; const [y,m,d]=iso.split('-'); return d?`${d}.${m}.${y}`:`${m}/${y}`; };
const eur=n=>(Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const eur0=n=>Math.round(Number(n)||0).toLocaleString('de-DE')+' €';
const parseDe=s=>{ if(s==null||s==='') return null; s=String(s).trim().replace(/\s|€/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isNaN(v)?null:Math.round(v*100)/100; };
const deNum=n=>n==null?'':Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} };

/* ============ Zustand ============ */
const EMPTY=()=>({config:{id:'config',upd:0,names:{a:'René',b:'Anika'},split:'income',kredit:{principal:0,rate:0,payment:0,start:'',fixYears:10,override:null},rueck:{amount:null,date:''}},items:[],tx:[],goals:[],accounts:[]});
const COLLS=['items','tx','goals','accounts'];
const S={data:EMPTY(), local:{me:null,fileId:null,role:null,folders:null,lastSync:0,lastSnapshot:0,dirty:false,apiKey:'',projectNumber:'',email:'',invited:[]}, ui:{tab:'home',month:ym(todayISO()),who:'all',cat:'',open:new Set()}};
const live=c=>S.data[c].filter(x=>!x.del);
const who=k=>k==='a'?S.data.config.names.a:k==='b'?S.data.config.names.b:'Gemeinsam';
const meKey=()=>S.local.me;

/* Speicher: ein Datensatz in IndexedDB, Fallback localStorage */
const DB={db:null,
  async open(){ try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open('haushaltsbuch',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); setTimeout(()=>rej('t'),4000); }); }catch(e){ this.db=null; } },
  async get(id){ if(!this.db){ try{ return JSON.parse(lsGet('hh.kv.'+id)||'null'); }catch(e){ return null; } }
    return new Promise(res=>{ try{ const r=this.db.transaction('kv').objectStore('kv').get(id); r.onsuccess=()=>res(r.result?.v??null); r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async put(id,v){ if(!this.db){ lsSet('hh.kv.'+id,JSON.stringify(v)); return; }
    return new Promise(res=>{ try{ const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').put({id,v}); t.oncomplete=res; t.onerror=res; }catch(e){ res(); } }); } };
let persistT=null;
function persist(){ clearTimeout(persistT); persistT=setTimeout(()=>{ DB.put('data',S.data); DB.put('local',{...S.local}); },200); }
function changed(){ S.local.dirty=true; persist(); scheduleSync(1500); render(); }
function upsert(c,rec){ rec.upd=Date.now(); rec.by=meKey(); const a=S.data[c]; const i=a.findIndex(x=>x.id===rec.id); if(i<0) a.push(rec); else a[i]=rec; changed(); }
function remove(c,id){ const r=S.data[c].find(x=>x.id===id); if(!r) return; for(const k of Object.keys(r)) if(k!=='id') delete r[k]; r.del=true; r.upd=Date.now(); changed(); }
function setConfig(fn){ fn(S.data.config); S.data.config.upd=Date.now(); changed(); }

/* ============ Rechnen ============ */
const active=(it,M)=>!it.del&&(!it.from||M>=it.from)&&(!it.until||M<=it.until);
const perYear=it=>it.every===1?12:(it.months?.length||12/(it.every||12));
const monthlyEq=it=>it.every===1?it.amount:it.amount*perYear(it)/12;
const dueIn=(it,M)=>it.every>1&&(it.months||[]).includes(+M.slice(5));
function month(M){
  const items=live('items').filter(it=>active(it,M));
  const sum=f=>items.filter(f).reduce((s,it)=>s+monthlyEq(it),0);
  const incA=sum(i=>i.kind==='income'&&i.payer==='a'), incB=sum(i=>i.kind==='income'&&i.payer==='b'), incG=sum(i=>i.kind==='income'&&i.payer==='g');
  const vorA=sum(i=>i.kind==='fix'&&i.payer==='a'&&i.vorab), vorB=sum(i=>i.kind==='fix'&&i.payer==='b'&&i.vorab);
  const baseA=Math.max(incA-vorA,0), baseB=Math.max(incB-vorB,0);
  const shareA=S.data.config.split==='half'?0.5:(baseA+baseB?baseA/(baseA+baseB):0.5);
  const fixG=sum(i=>i.kind==='fix'&&i.payer==='g'&&i.every===1), varG=sum(i=>i.kind==='var'&&i.payer==='g');
  const rueck=sum(i=>i.kind==='fix'&&i.payer==='g'&&i.every>1);
  const ingNeed=fixG+varG-incG;
  const pers=p=>({fix:sum(i=>i.kind==='fix'&&i.payer===p), var:sum(i=>i.kind==='var'&&i.payer===p), save:sum(i=>i.kind==='save'&&i.payer===p)});
  const pa=pers('a'), pb=pers('b'); const saveG=sum(i=>i.kind==='save'&&i.payer==='g');
  const trA={ing:ingNeed*shareA, rueck:rueck*shareA}, trB={ing:ingNeed*(1-shareA), rueck:rueck*(1-shareA)};
  const freeA=incA-trA.ing-trA.rueck-pa.fix-pa.var-pa.save, freeB=incB-trB.ing-trB.rueck-pb.fix-pb.var-pb.save-saveG*0;
  const income=incA+incB+incG, costs=fixG+rueck+pa.fix+pb.fix, budget=varG+pa.var+pb.var, saves=pa.save+pb.save+saveG;
  const surplus=income-costs-budget-saves;
  // tatsächliche Buchungen
  const txs=live('tx').filter(t=>ym(t.date)===M);
  const cats=items.filter(i=>i.kind==='var').map(i=>({it:i, spent:txs.filter(t=>t.type!=='in'&&t.cat===i.id).reduce((s,t)=>s+t.amount,0)}));
  const known=new Set(cats.map(c=>c.it.id));
  const other=txs.filter(t=>t.type!=='in'&&!known.has(t.cat)).reduce((s,t)=>s+t.amount,0);
  const spent=cats.reduce((s,c)=>s+c.spent,0)+other;
  const extraIn=txs.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const due=live('items').filter(it=>active(it,M)&&dueIn(it,M));
  return {M,items,incA,incB,incG,baseA,baseB,vorA,vorB,income,shareA,fixG,varG,rueck,ingNeed,pa,pb,saveG,trA,trB,freeA,freeB,costs,budget,saves,surplus,txs,cats,other,spent,extraIn,due,
    savingsRate: income?(saves+Math.max(surplus,0))/income:0};
}
function rueckProjection(){ const r=S.data.config.rueck; const start=r.date?ym(r.date):ym(todayISO()); let bal=r.amount??0; const out=[];
  for(let k=1;k<=12;k++){ const M=addM(start,k); const mm=month(M); const dueSum=mm.due.filter(i=>i.payer==='g').reduce((s,i)=>s+i.amount,0);
    const unknown=live('items').filter(i=>active(i,M)&&i.payer==='g'&&i.every>1&&!(i.months||[]).length).reduce((s,i)=>s+monthlyEq(i),0);
    bal=bal+mm.rueck-dueSum-unknown; out.push({M,dep:mm.rueck,out:dueSum+unknown,bal,due:mm.due.filter(i=>i.payer==='g')}); }
  return {known:r.amount!=null, rows:out, min:Math.min(...out.map(o=>o.bal))}; }
function kredit(){ const k=S.data.config.kredit; if(!k.principal||!k.payment||!k.start) return null; const r=k.rate/1200;
  let P=k.principal, from=k.start; if(k.override?.amount!=null&&k.override.date){ P=k.override.amount; from=ym(k.override.date); }
  const bal=n=>{ if(n<=0) return P; const f=Math.pow(1+r,n); return Math.max(r?P*f-k.payment*(f-1)/r:P-k.payment*n,0); };
  const now=ym(todayISO()); const n=Math.max(mDiff(from,now),0); const b=bal(n);
  const end=addM(k.start,k.fixYears*12); const bEnd=bal(mDiff(from,end));
  let payoff=null; for(let m=n;m<n+600;m++){ if(bal(m)<=0){ payoff=addM(from,m); break; } }
  return {balance:b, interest:b*r, tilgung:k.payment-b*r, end, bEnd, payoff, progress:1-b/k.principal, yearsToEnd:mDiff(now,end)/12}; }
function netWorth(){ const acc=live('accounts'); const last=a=>a.history?.length?a.history[a.history.length-1]:null;
  const sum=acc.reduce((s,a)=>s+(last(a)?.balance||0),0); const kr=kredit(); return {sum, debt:kr?kr.balance:0, acc:acc.map(a=>({a,last:last(a)}))}; }

/* ============ Google Drive (gemeinsame Datei) ============ */
const SCOPE='https://www.googleapis.com/auth/drive.file';
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');
function token(){ try{ return JSON.parse(lsGet('hh.token')||'null'); }catch(e){ return null; } }
function tokenValid(){ const t=token(); return !!(t&&t.exp>Date.now()+60000); }
function startAuth(silent){ const st=uid(); lsSet('hh.oauthState',st); if(silent) lsSet('hh.silentAt',String(Date.now()));
  const p=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri(),response_type:'token',scope:SCOPE,include_granted_scopes:'true',state:st});
  if(S.local.email) p.set('login_hint',S.local.email); if(silent) p.set('prompt','none');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p; }
function handleAuthRedirect(){ const h=location.hash; if(!h||!/access_token=|error=/.test(h)) return null; const p=new URLSearchParams(h.slice(1));
  history.replaceState(null,'',location.pathname+location.search); if(p.get('state')!==lsGet('hh.oauthState')) return 'state'; if(p.get('error')) return p.get('error');
  lsSet('hh.token',JSON.stringify({access_token:p.get('access_token'),exp:Date.now()+(+p.get('expires_in')||3600)*1000})); return 'ok'; }
class AuthErr extends Error{}
async function gfetch(url,opts={}){ const t=token(); if(!t) throw new AuthErr('Nicht angemeldet');
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+t.access_token}});
  if(r.status===401){ lsSet('hh.token',null); throw new AuthErr('Anmeldung abgelaufen'); }
  if(!r.ok){ let m=r.status+''; try{ m=(await r.json()).error.message; }catch(e){} const e=new Error('Google Drive: '+m); e.status=r.status; throw e; } return r; }
const gjson=(u,o={})=>gfetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}).then(r=>r.json());
const qs=encodeURIComponent;
async function findOne(q){ const r=await gjson(`https://www.googleapis.com/drive/v3/files?q=${qs(q)}&fields=files(id,name)&spaces=drive&pageSize=5`); return r.files?.[0]||null; }
async function upload({name,mime,body,parents,app,fileId}){ const meta=fileId?{}:{name,parents,appProperties:app}; const bd='hh'+uid();
  const b=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`,body,`\r\n--${bd}--`]);
  return (await gfetch(`https://www.googleapis.com/upload/drive/v3/files${fileId?'/'+fileId:''}?uploadType=multipart&fields=id`,{method:fileId?'PATCH':'POST',headers:{'Content-Type':`multipart/related; boundary=${bd}`},body:b})).json(); }
async function ensureOwnerFile(){ const L=S.local; L.folders=L.folders||{};
  if(!L.folders.root){ let f=await findOne(`appProperties has { key='hh' and value='root' } and trashed=false`);
    if(!f) f=await gjson('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',body:JSON.stringify({name:'Haushaltsbuch',mimeType:'application/vnd.google-apps.folder',appProperties:{hh:'root'}})}); L.folders.root=f.id; }
  if(!L.folders.backup){ let f=await findOne(`'${L.folders.root}' in parents and appProperties has { key='hh' and value='backup' } and trashed=false`);
    if(!f) f=await gjson('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',body:JSON.stringify({name:'Backup',mimeType:'application/vnd.google-apps.folder',parents:[L.folders.root],appProperties:{hh:'backup'}})}); L.folders.backup=f.id; }
  if(!L.fileId){ const f=await findOne(`appProperties has { key='hh' and value='data' } and trashed=false`); if(f) L.fileId=f.id; }
  persist(); }
function merge(a,b){ if(!b) return a; const out={config:(b.config?.upd||0)>(a.config?.upd||0)?b.config:a.config};
  for(const c of COLLS){ const m=new Map(); for(const r of (a[c]||[])) m.set(r.id,r); for(const r of (b[c]||[])){ const x=m.get(r.id); if(!x||(r.upd||0)>(x.upd||0)) m.set(r.id,r); } out[c]=[...m.values()].sort((x,y)=>x.id<y.id?-1:1); }
  return out; }
const stable=d=>JSON.stringify({config:d.config,...Object.fromEntries(COLLS.map(c=>[c,[...(d[c]||[])].sort((x,y)=>x.id<y.id?-1:1)]))});
let syncing=false, again=false, syncT=null; const SYNC={state:'idle',msg:''};
function scheduleSync(ms){ clearTimeout(syncT); syncT=setTimeout(()=>syncNow({}),ms); }
function setSync(s,m=''){ SYNC.state=s; SYNC.msg=m; renderChip(); }
async function syncNow({interactive=false}={}){
  if(IN_PREVIEW) return setSync('preview'); if(!S.local.me) return setSync('idle');
  if(!navigator.onLine) return setSync('offline');
  if(!tokenValid()){ if(interactive) return startAuth(false); return setSync('auth'); }
  if(S.local.role==='member'&&!S.local.fileId) return setSync('join');
  if(syncing){ again=true; return; } syncing=true; setSync('running');
  try{
    if(S.local.role!=='member') await ensureOwnerFile();
    let remote=null;
    if(S.local.fileId){ try{ remote=await (await gfetch(`https://www.googleapis.com/drive/v3/files/${S.local.fileId}?alt=media`)).json(); }catch(e){ if(e instanceof AuthErr) throw e; if(e.status===404&&S.local.role!=='member') S.local.fileId=null; else throw e; } }
    const merged=merge(S.data,remote); const body=stable(merged);
    if(!remote||body!==stable(remote)){ const blob=new Blob([body],{type:'application/json'});
      if(S.local.fileId) await upload({fileId:S.local.fileId,mime:'application/json',body:blob});
      else { const r=await upload({name:'haushalt-daten.json',mime:'application/json',body:blob,parents:[S.local.folders.root],app:{hh:'data'}}); S.local.fileId=r.id; } }
    const changedLocal=stable(S.data)!==body; S.data=JSON.parse(body); S.local.dirty=false; S.local.lastSync=Date.now();
    if(S.local.role!=='member'&&Date.now()-(S.local.lastSnapshot||0)>7*864e5){ await upload({name:`haushalt-backup-${todayISO()}.json`,mime:'application/json',body:new Blob([body],{type:'application/json'}),parents:[S.local.folders.backup],app:{hh:'snapshot'}}); S.local.lastSnapshot=Date.now();
      const r=await gjson(`https://www.googleapis.com/drive/v3/files?q=${qs(`'${S.local.folders.backup}' in parents and trashed=false`)}&fields=files(id,name)&orderBy=name desc&pageSize=50`);
      for(const f of (r.files||[]).slice(12)) await gjson(`https://www.googleapis.com/drive/v3/files/${f.id}`,{method:'PATCH',body:JSON.stringify({trashed:true})}); }
    persist(); setSync('ok'); if(changedLocal&&!$('#overlay')) render();
  }catch(e){ if(e instanceof AuthErr) setSync('auth'); else setSync('error',e.message||String(e)); }
  finally{ syncing=false; if(again){ again=false; scheduleSync(400); } } }
async function invite(email){ if(!tokenValid()){ startAuth(false); return; } if(!S.local.fileId) await syncNow({}); if(!S.local.fileId){ toast('Erst einmal sichern, dann einladen.'); return; }
  await gjson(`https://www.googleapis.com/drive/v3/files/${S.local.fileId}/permissions?sendNotificationEmail=true&emailMessage=${qs('Unser gemeinsames Haushaltsbuch. Öffne die App und tippe auf „Haushaltsbuch von René öffnen“.')}`,{method:'POST',body:JSON.stringify({type:'user',role:'writer',emailAddress:email})});
  S.local.invited=[...new Set([...(S.local.invited||[]),email])]; persist(); render(); toast(`${email} ist eingeladen.`); }
const libs={}; function loadScript(src){ if(libs[src]) return libs[src]; libs[src]=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ delete libs[src]; rej(new Error('Laden fehlgeschlagen')); }; document.head.appendChild(s); }); return libs[src]; }
async function pickShared(){ if(!tokenValid()){ startAuth(false); return; }
  const key=S.local.apiKey||API_KEY, proj=S.local.projectNumber||PROJECT_NUMBER; if(!key||!proj){ toast('Für das Öffnen fehlen API-Schlüssel und Projektnummer (unter „Google Drive“).'); return; }
  try{ await loadScript('https://apis.google.com/js/api.js'); await new Promise(r=>gapi.load('picker',r));
    const view=new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setOwnedByMe(false).setQuery('haushalt-daten');
    new google.picker.PickerBuilder().addView(view).setOAuthToken(token().access_token).setDeveloperKey(key).setAppId(proj).setTitle('Haushaltsbuch auswählen').setLocale('de')
      .setCallback(async d=>{ if(d.action===google.picker.Action.PICKED){ S.local.fileId=d.docs[0].id; S.local.role='member'; persist(); await syncNow({}); render(); toast('Haushaltsbuch verbunden'); } }).build().setVisible(true);
  }catch(e){ toast(e.message||'Auswahl konnte nicht geöffnet werden.'); } }

let toastT=null; function toast(m){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3600); }
function openSheet(title,html){ closeSheet(); const o=document.createElement('div'); o.className='overlay'; o.id='overlay';
  o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="x" data-close aria-label="Schließen">×</button></header><div class="body">${html}</div></div>`;
  o.addEventListener('click',e=>{ if(e.target===o||e.target.closest('[data-close]')) closeSheet(); }); document.body.appendChild(o); document.body.style.overflow='hidden'; return o.querySelector('.body'); }
function closeSheet(){ $('#overlay')?.remove(); document.body.style.overflow=''; }
function confirmBox(text,ok='OK'){ return new Promise(res=>{ const o=document.createElement('div'); o.className='overlay'; o.style.alignItems='center'; o.style.zIndex=70;
  o.innerHTML=`<div class="card" style="max-width:420px;width:calc(100% - 32px);display:flex;flex-direction:column;gap:14px;background:var(--sheet)"><p style="margin:0">${esc(text)}</p><div class="row-btns"><button class="btn" data-v="0">Abbrechen</button><button class="btn primary" data-v="1">${esc(ok)}</button></div></div>`;
  o.addEventListener('click',e=>{ const b=e.target.closest('[data-v]'); if(b||e.target===o){ o.remove(); res(b?.dataset.v==='1'); } }); document.body.appendChild(o); }); }
function renderChip(){ const el=$('#syncchip'); if(!el) return; const map={preview:['','Vorschau'],idle:['','Lokal'],offline:['warn','Offline'],auth:['warn','Anmelden'],join:['warn','Nicht verbunden'],running:['','Synchronisiere …'],ok:['ok','Synchron'],error:['err','Sync-Fehler']};
  const [c,l]=map[SYNC.state]||map.idle; el.className='chip '+c; el.innerHTML=`<span class="dot"></span>${esc(l)}${SYNC.state==='ok'&&S.local.lastSync?' '+new Date(S.local.lastSync).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):''}`; el.title=SYNC.msg||''; }

  const n=S.data.config.names;

    ${kr?tile(ICON.house,'violet','Kredit',[['Restschuld',eur0(kr.balance)],['Getilgt',Math.round(kr.progress*100)+' %']],'data-go="kredit"'):''}

  const upHtml=up.slice(0,6).map(({M:MM,it})=>`<div class="item"><span class="glyph ${it.payer==='g'?'orange':'blue'}">${MSHORT[+MM.slice(5)-1]}</span><span class="main"><span class="t">${esc(it.name)}</span><span class="sub">${mName(MM)} · ${it.payer==='g'?'Rücklagenkonto':esc(who(it.payer))}</span></span><span class="a num">${eur(it.amount)}</span></div>`).join('');

      if(!a.name) return toast('Bitte einen Namen eintragen.'); closeSheet(); upsert('accounts',a); }
    if(b.id==='a-del'&&await confirmBox('Konto löschen?','Löschen')){ closeSheet(); remove('accounts',a.id); } }); }

function download(name,content,mime){ if(IN_PREVIEW){ toast('Downloads funktionieren in der installierten App.'); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); }

function render(){ const M=S.ui.month; const n=S.data.config.names; const me=S.local.me;
  const H={home:[me?`Hallo, ${who(me)}`:'Hallo','Euer Haushaltsbuch','Budget, Ausgaben und Rücklagen auf einen Blick'],tx:['Buchungen','',`Alle Ausgaben im ${MONTHS[+M.slice(5)-1]}`],plan:['Budget','','Einnahmen, Fixkosten und wer wie viel überweist'],more:['Mehr','','Rücklage, Kredit, Sparziele und Sync']}[S.ui.tab]||['Hallo','',''];
  $('#hTitle').textContent=H[0]; $('#hLead').textContent=H[1]; $('#hLead').hidden=!H[1]; $('#hSub').textContent=H[2]; $('#mLabel').textContent=mName(M);
  document.querySelectorAll('.tab[data-tab]').forEach(t=>{ if(t.dataset.tab!=='add') t.setAttribute('aria-current',t.dataset.tab===S.ui.tab?'page':'false'); });
  const v={home:viewHome,tx:viewTx,plan:viewPlan,more:viewMore}[S.ui.tab]; $('#view').innerHTML=me?v():viewOnboarding(); renderChip(); }

function bind(){ $('#mPrev').onclick=()=>{ S.ui.month=addM(S.ui.month,-1); render(); }; $('#mNext').onclick=()=>{ S.ui.month=addM(S.ui.month,1); render(); };
  document.querySelector('.tabbar').addEventListener('click',e=>{ const t=e.target.closest('[data-tab]'); if(!t) return; if(!S.local.me) return toast('Wähl zuerst aus, wer dieses Handy nutzt.'); if(t.dataset.tab==='add') return openTx(null); S.ui.tab=t.dataset.tab; render(); scrollTo(0,0); });
  $('#inImport').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const d=JSON.parse(await f.text()); if(!d.items||!d.config) throw 0;
      if(!await confirmBox(`Datei mit ${d.items.length} Posten und ${(d.tx||[]).length} Buchungen laden? Sie wird mit den vorhandenen Daten zusammengeführt.`,'Laden')) return;
      S.data=merge(S.data,{tx:[],goals:[],accounts:[],...d}); changed(); toast('Daten geladen'); }catch(err){ toast('Die Datei ist kein Haushaltsbuch-Backup.'); } };
  const view=$('#view');
  view.addEventListener('click',async e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
    if(d.me){ S.local.me=d.me; S.local.role=S.local.role||(d.me==='a'?'owner':'member'); persist(); render(); syncNow({}); return; }
    if(b.hasAttribute('data-me-switch')){ S.local.me=S.local.me==='a'?'b':'a'; persist(); render(); return toast(`Dieses Handy gehört jetzt ${who(S.local.me)}.`); }
    if(d.tx) return openTx(d.tx); if(d.item) return openItem(d.item); if(d.newitem) return openItem(null,d.newitem);
    if(d.goal) return openGoal(d.goal); if(d.acc) return openAcc(d.acc);
    if(d.cat){ S.ui.cat=d.cat; S.ui.tab='tx'; render(); scrollTo(0,0); return; }
    if(d.who){ S.ui.who=d.who; render(); return; }
    if(d.tabGo){ if(d.tabGo==='add') return openTx(null); S.ui.tab=d.tabGo; render(); scrollTo(0,0); return; }
    if(d.go){ S.ui.tab='more'; render(); setTimeout(()=>document.getElementById(d.go)?.scrollIntoView({behavior:'smooth'}),50); return; }
    if(d.split) return setConfig(c=>c.split=d.split);
    switch(d.action){
      case 'sync': return syncNow({interactive:true});
      case 'pick': return pickShared();
      case 'invite': { const em=$('#inv').value.trim(); if(!/^\S+@\S+\.\S+$/.test(em)) return toast('Bitte eine gültige E-Mail-Adresse eintragen.'); try{ await invite(em); }catch(err){ toast(err.message); } return; }
      case 'export': return download(`haushalt-backup-${todayISO()}.json`,stable(S.data),'application/json');
      case 'import': return $('#inImport').click();
      case 'csv': { const rows=[['Datum','Art','Kategorie','Betrag','Wer','Notiz'],...live('tx').sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'Einnahme':'Ausgabe',t.type==='in'?'':catName(t.cat),deNum(t.amount),who(t.who),t.note||''])];
        return download(`buchungen-${todayISO()}.csv`,'﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv'); } } });
  view.addEventListener('change',e=>{ const t=e.target;
    if(t.id==='catf'){ S.ui.cat=t.value; render(); return; }
    if(t.dataset.c){ const path=t.dataset.c.split('.'); const numeric=!/names|date|start/.test(t.dataset.c)&&t.type!=='date'&&t.type!=='month';
      const val=numeric?parseDe(t.value):t.value.trim();
      setConfig(c=>{ let o=c; for(const k of path.slice(0,-1)){ if(o[k]==null) o[k]={}; o=o[k]; } o[path[path.length-1]]=val; }); toast('Gespeichert'); return; }
    if(t.dataset.l){ S.local[t.dataset.l]=t.value.trim(); persist(); toast('Gespeichert'); } });
  view.addEventListener('toggle',e=>{ const k=e.target.dataset?.open; if(k){ e.target.open?S.ui.open.add(k):S.ui.open.delete(k); } },true);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncNow({}); });
  setInterval(()=>{ if(document.visibilityState==='visible'&&tokenValid()) syncNow({}); },90000);
  addEventListener('online',()=>syncNow({})); }

(async function boot(){
  const auth=IN_PREVIEW?null:handleAuthRedirect();
  await DB.open(); const d=await DB.get('data'), l=await DB.get('local');
  if(d) S.data={...EMPTY(),...d}; else if(SEED){ S.data={...EMPTY(),...JSON.parse(JSON.stringify(SEED))}; }
  if(l) S.local={...S.local,...l};
  if(IN_PREVIEW&&!S.local.me) S.local.me='a';
  bind(); render();
  if(auth==='ok') toast('Mit Google verbunden'); else if(auth&&auth!=='state') setSync('auth','Google-Anmeldung: '+auth);
  if(!IN_PREVIEW&&'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const last=+(lsGet('hh.silentAt')||0);
  if(!IN_PREVIEW&&S.local.me&&!tokenValid()&&navigator.onLine&&!auth&&(S.local.fileId||S.local.role==='owner')&&Date.now()-last>10*60000){ startAuth(true); return; }
  syncNow({});
})();
</script>
